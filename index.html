<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020508" />
    <meta name="description" content="Play Space Attack. Dodge diving aliens, watch your fuel, and chase your high score." />
    <title>Space Attack</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="cabinet" class="game-shell" aria-label="Space Attack arcade">
      <div class="game-stage">
      <h1 class="sr-only">Space Attack</h1>
      <p class="sr-only" id="instructions">Left and right arrows to move. Hold space to fire. Enter to start or restart. Escape to pause. M to toggle sound.</p>
      <div id="game-canvas" role="img" aria-label="Space Attack playfield" aria-describedby="instructions" tabindex="0"></div>
      <!-- Invisible native hit targets give the Pixi-drawn controls keyboard and screen-reader access. -->
      <button class="game-action" id="start-button" aria-label="Start game"><span class="sr-only">Start game</span></button>
      <button class="game-action" id="restart-button" aria-label="Play again" hidden><span class="sr-only">Play again</span></button>
      <button class="game-action" id="resume-button" aria-label="Resume game" hidden><span class="sr-only">Resume game</span></button>
      <button class="game-action" id="sound-button" aria-label="Mute sound" aria-pressed="false" title="Sound (M)"><span class="sr-only">Sound</span></button>
      <button class="game-action" id="effects-button" aria-label="Toggle visual effects" aria-pressed="true" title="Visual effects"><span class="sr-only">Effects</span></button>
      <button class="game-action" id="fullscreen-button" aria-label="Enter fullscreen" title="Fullscreen"><span class="sr-only">Fullscreen</span></button>
      <p class="sr-only" id="game-announcement" role="status" aria-live="polite"></p>
      <div id="error-screen" hidden><h2>GAME UNAVAILABLE</h2><p>Enable WebGL and reload to try again.</p><button onclick="location.reload()">RELOAD</button></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
